services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dualeat_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dualeat-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  dualeat-network:
    driver: bridge

# VITE_API_URL=http://localhost:3000 (SIN NGROK)